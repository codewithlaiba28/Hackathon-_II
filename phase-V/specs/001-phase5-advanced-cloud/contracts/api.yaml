openapi: 3.0.0
info:
  title: Todo Chatbot API (Phase 5)
  version: 1.0.0
  description: API for managing advanced Todo Chatbot features including recurring tasks, due dates, reminders, priorities, tags, search, filter, and sort.

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
          default: pending
        priority:
          type: string
          enum: [High, Medium, Low]
          default: Medium
        tags:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        is_recurring:
          type: boolean
          default: false
        recurring_frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
        parent_task_id:
          type: integer
          nullable: true
        user_id:
          type: string
          readOnly: true
      required:
        - title
    
    TaskCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [High, Medium, Low]
          default: Medium
        tags:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        is_recurring:
          type: boolean
          default: false
        recurring_frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
        parent_task_id:
          type: integer
          nullable: true
      required:
        - title

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
          nullable: true
        priority:
          type: string
          enum: [High, Medium, Low]
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        is_recurring:
          type: boolean
          nullable: true
        recurring_frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
        parent_task_id:
          type: integer
          nullable: true

    TaskListFilter:
      type: object
      properties:
        status:
          type: string
          enum: [pending, completed]
          nullable: true
        priority:
          type: string
          enum: [High, Medium, Low]
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        due_date_start:
          type: string
          format: date-time
          nullable: true
        due_date_end:
          type: string
          format: date-time
          nullable: true
        search_query:
          type: string
          nullable: true
        sort_by:
          type: string
          enum: [created_date, due_date, priority, title]
          default: due_date
        sort_order:
          type: string
          enum: [asc, desc]
          default: asc

    ReminderSet:
      type: object
      properties:
        task_id:
          type: integer
        remind_at:
          type: string
          format: date-time
      required:
        - task_id
        - remind_at

    ReminderCancel:
      type: object
      properties:
        task_id:
          type: integer
      required:
        - task_id

paths:
  /tasks:
    get:
      summary: List and filter tasks
      description: Retrieve a list of tasks, with options for filtering, searching, and sorting.
      operationId: listTasks
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/status'
        - in: query
          name: priority
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/priority'
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
        - in: query
          name: due_date_start
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/due_date_start'
        - in: query
          name: due_date_end
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/due_date_end'
        - in: query
          name: search_query
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/search_query'
        - in: query
          name: sort_by
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/sort_by'
        - in: query
          name: sort_order
          schema:
            $ref: '#/components/schemas/TaskListFilter/properties/sort_order'
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized

    post:
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized

  /tasks/{task_id}:
    get:
      summary: Get a task by ID
      operationId: getTaskById
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    
    put:
      summary: Update an existing task
      operationId: updateTask
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found

    delete:
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /tasks/{task_id}/complete:
    post:
      summary: Mark a task as complete
      operationId: completeTask
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task marked as complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /reminders:
    post:
      summary: Schedule a reminder for a task
      operationId: setReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderSet'
      responses:
        '200':
          description: Reminder scheduled
        '401':
          description: Unauthorized
        '404':
          description: Task not found

    delete:
      summary: Cancel a reminder for a task
      operationId: cancelReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCancel'
      responses:
        '200':
          description: Reminder cancelled
        '401':
          description: Unauthorized
        '404':
          description: Task not found
