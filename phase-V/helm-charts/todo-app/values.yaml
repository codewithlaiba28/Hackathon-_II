# Default values for todo-app

# Frontend configuration
frontend:
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Frontend-specific database URL (contains Better Auth tables)
  databaseUrl: "postgresql://neondb_owner:npg_zuUPO0C6YqLn@ep-aged-thunder-ah49616e-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require"
  betterAuthUrl: "http://localhost:3000"
  nextPublicBaseUrl: "http://localhost:3000"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations: 
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 800Mi
    requests:
      cpu: 200m
      memory: 400Mi

