apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-db-secret
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: todo-backend
type: Opaque
data:
  database-url: {{ .Values.database.url | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-api-keys
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: todo-backend
type: Opaque
data:
  cerebras-api-key: {{ .Values.backend.cerebrasApiKey | default "" | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-auth-secret
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: todo-backend
type: Opaque
data:
  auth-secret: {{ .Values.backend.authSecret | default "" | b64enc | quote }}