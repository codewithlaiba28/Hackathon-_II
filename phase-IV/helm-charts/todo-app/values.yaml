# Default values for todo-app

# Frontend configuration
frontend:
  image:
    repository: todo-frontend
    tag: v4
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 800Mi
    requests:
      cpu: 200m
      memory: 400Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://127.0.0.1"

# Backend configuration
backend:
  image:
    repository: todo-backend
    tag: v26
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 400m
      memory: 800Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Secrets/Secrets-derived values
